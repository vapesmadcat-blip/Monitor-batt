# Required GitHub Actions secrets:
# - RELEASE_STORE_FILE (base64-encoded .jks keystore)
# - RELEASE_STORE_PASSWORD (keystore password)
# - RELEASE_KEY_ALIAS (key alias)
# - RELEASE_KEY_PASSWORD (key password)
# - GOOGLE_PLAY_SERVICE_ACCOUNT_JSON (Google Play service account JSON, plain text)
name: Release AAB to Play Store

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          RELEASE_STORE_FILE_B64: ${{ secrets.RELEASE_STORE_FILE || secrets.SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_STORE_FILE_B64" ]; then
            echo "::error::Missing RELEASE_STORE_FILE secret"
            exit 1
          fi
          echo "$RELEASE_STORE_FILE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Prepare Google Play service account file
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret"
            exit 1
          fi
          cat > "$RUNNER_TEMP/google-play-service-account.json" <<EOF
          $GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
          EOF
          echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_FILE=$RUNNER_TEMP/google-play-service-account.json" >> "$GITHUB_ENV"

      - name: Build signed AAB
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload to Google Play (internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_FILE }}
          packageName: com.vapesmadcat.monitorbatt
          releaseFiles: app/build/outputs/bundle/release/*.aab
          tracks: internal
          status: completed
